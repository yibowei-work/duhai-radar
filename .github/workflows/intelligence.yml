name: Collect and publish intelligence

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      anchor_date:
        description: "上海日期（YYYY-MM-DD）；留空则自动判断"
        required: false
        type: string
      mode:
        description: "回查模式"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - weekly
          - monthly

permissions: {}

concurrency:
  group: duhai-intelligence-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test date and normalization rules
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Plan Shanghai-time review windows
        env:
          INPUT_ANCHOR: ${{ inputs.anchor_date }}
          INPUT_MODE: ${{ inputs.mode || 'auto' }}
        run: >-
          python scripts/plan_windows.py
          --anchor "$INPUT_ANCHOR"
          --mode "$INPUT_MODE"
          --state data/state/schedule.json
          --output work/plan.json

      - name: Collect public intelligence
        id: collector
        shell: bash
        run: |
          set +e
          python scripts/collect.py \
            --plan work/plan.json \
            --sources config/sources.json \
            --data data/intel.json \
            --state data/state/schedule.json \
            --report work/collector-report.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            exit "$code"
          fi

      - name: Validate publishable data
        run: python scripts/validate_data.py --data data/intel.json

      - name: Save refreshed data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh intelligence [run $GITHUB_RUN_ID]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-run-${{ github.run_id }}
          path: |
            work/plan.json
            work/collector-report.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out validated data
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
